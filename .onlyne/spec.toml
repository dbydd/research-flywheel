admin = false
max_sessions = 1
relay_required = ["pi"]
reuse = true
allowed_senders = ["pi", "theorist", "examiner", "chair", "scribe", "planner", "speculator"]
allowed_targets = ["pi", "theorist", "examiner", "chair", "scribe", "planner", "speculator"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]
[client.timeout]
ready_ms = 30000
running_ms = 120000

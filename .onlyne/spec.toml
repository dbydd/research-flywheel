# Onlyne v1 cluster spec. Written by `onlyne-server init`.
#
# `name` is the cluster name handed to every client.
# `listen` is the TCP address the routing daemon binds.
# `cert_pin` pins the server certificate stored in `.onlyne/keys/server.key`,
# and every client verifies the TLS endpoint against it.
[server]
name = "formal-research"
listen = "127.0.0.1:7820"
cert_pin = "sha256/REPLACE_ME_after_server_init"
note_queue = false
fault_history_days = 14
resync_lag = 256
heartbeat_timeout_ms = 30000
agent_package = "/Users/dbydd/Documents/progs/onlyne/plugins/onlyne-agent-pi"
template_root = ".onlyne/templates"

# Each role is one `[[client]]` row. `onlyne-client init` prints a ready row
# whose `key` value matches the workspace it just created.
#
# ---- formal-research 十角色（五域大循环；supervisor 不注册）。----
# 拓扑唯一事实源=根 AGENTS.md 角色表与 ACL 边集；prose 薄壳，细则在 templates/formal/<phase>/<role>/AGENTS.md。
# 冷启动第一发：onlyne send --server-root . --from planner --to pi --file payload/first.md
# 域分组仅注释（D1..D5），无 domain 字段。intent 大数方案（0=首次失败即 exhausted，弃用）；runner 单开 running_ms 承接旧 bench。

# ---- 申报 ----

[[client]]
role = "pi"
key = "ed25519/AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="
prose = """你是 formal-research 的 pi（首席研究员，研究项目文件头四段作者）。作业细则在本工作区 AGENTS.md，先读它再动手。"""
admin = false
max_sessions = 1
relay_required = ["examiner"]
reuse = true
allowed_senders = ["librarian", "planner", "examiner"]
allowed_targets = ["examiner", "librarian"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]
[client.timeout]
ready_ms = 30000
running_ms = 120000
idle_ms = 60000
[client.intent]
attempts = 100000
backoff_ms = [1000, 2000, 4000, 10000, 30000, 60000]

[[client]]
role = "librarian"
key = "ed25519/AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="

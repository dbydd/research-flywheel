# Onlyne v1 cluster spec. Written by `onlyne-server init`.
#
# `name` is the cluster name handed to every client.
# `listen` is the TCP address the routing daemon binds.
# `cert_pin` pins the server certificate stored in `.onlyne/keys/server.key`,
# and every client verifies the TLS endpoint against it.
[server]
name = "aris"
listen = "127.0.0.1:7813"
cert_pin = "sha256/fHPf1Ds9Fdk8yjZ2Ew4YwLA602DJnrg9D/hrb1lWQdY="
note_queue = false
fault_history_days = 14
resync_lag = 256
heartbeat_timeout_ms = 30000
agent_package = "__AGENT_PACKAGE_ABS__"
template_root = ".onlyne/templates"

# Each role is one `[[client]]` row. `onlyne-client init` prints a ready row
# whose `key` value matches the workspace it just created.

# ---- ARIS 五角色（研究飞轮 v3 · supervisor 不注册，admin 面代行）。----
# 拓扑唯一事实源=根 AGENTS.md 角色表；prose 薄壳，细则在 templates/aris/<role>/AGENTS.md。
# 第一发注入：onlyne --server-root . send --from critic --to scout --file payload/first.md
# intent 大数方案（0=首次失败即 exhausted，弃用）；bench 单开 running_ms 承接旧 busy_secs。

[[client]]
role = "scout"
key = "ed25519/I9WUlCwAZHabxWYIaT2yNpaHibUaAIHBlbQdPrOrjtc="
prose = """你是 ARIS 研究飞轮的 scout（前沿侦察员，entry role）。你的作业细则在本工作区 AGENTS.md（检索标准、入池硬门、固化与派发、失败回传接收口），先读它再动手。上报纪律：onlyne_complete 的 text 一行放全（idea id、run-id、证据路径），写不下落文件指路径。"""
admin = false
max_sessions = 1
reuse = true
allowed_senders = ["critic", "model", "bench", "writer"]
allowed_targets = ["model"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]
[client.timeout]
ready_ms = 30000
running_ms = 120000
idle_ms = 60000
[client.intent]
attempts = 100000
backoff_ms = [1000, 2000, 4000, 10000, 30000, 60000]

[[client]]
role = "model"
key = "ed25519/+4quh3c6fGmojfCMN3Mp84sBoM97DJfFS7+BioSCFm4="
prose = """你是 ARIS 研究飞轮的 model（推导+Lean 形式化+出 spec）。作业细则在本工作区 AGENTS.md，先读它。你只出 spec，不写 experiment/ 代码。上报一行放全，细节落 runs/。"""
admin = false
max_sessions = 1
reuse = true
allowed_senders = ["scout", "critic"]
allowed_targets = ["bench", "writer", "scout"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]
[client.timeout]
ready_ms = 30000
running_ms = 120000
idle_ms = 60000
[client.intent]
attempts = 100000
backoff_ms = [1000, 2000, 4000, 10000, 30000, 60000]

[[client]]
role = "bench"
key = "ed25519/MA4ewa9eCvxd23UfMwUveXEnnVM+nptGZIARLkMKUyw="
prose = """你是 ARIS 研究飞轮的 bench（跑批与测量）。作业细则与功耗纪律、训练槽协议在本工作区 AGENTS.md，先读它。数值只出自 measured/，失败也归档。"""
admin = false
max_sessions = 1
reuse = true
allowed_senders = ["model"]
allowed_targets = ["writer", "scout"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]
[client.timeout]
ready_ms = 30000
running_ms = 3600000
idle_ms = 60000
[client.intent]
attempts = 100000
backoff_ms = [1000, 2000, 4000, 10000, 30000, 60000]

[[client]]
role = "writer"
key = "ed25519/thc7+p7XESsaC5oT3hGAdpP+Z57Udeb+0BKKhyY/VZk="
prose = """你是 ARIS 研究飞轮的 writer（成稿，figure 兼职归你）。作业细则与 vault 写作规范在本工作区 AGENTS.md，先读它。不写无数据稿；每个数字标 measured/ 来源。"""
admin = false
max_sessions = 1
reuse = true
allowed_senders = ["model", "bench", "critic"]
allowed_targets = ["critic", "scout"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]
[client.timeout]
ready_ms = 30000
running_ms = 120000
idle_ms = 60000
[client.intent]
attempts = 100000
backoff_ms = [1000, 2000, 4000, 10000, 30000, 60000]

[[client]]
role = "critic"
key = "ed25519/g95WE569KtP1szu8lfEOdWjhHyYVeEzWpO+bD61CEfo="
prose = """你是 ARIS 研究飞轮的 critic（审稿+归档+提下一条 idea）。作业细则与本跳归档职责在本工作区 AGENTS.md，先读它。只依据磁盘材料裁决；revise 分文字→writer、理论→model；accept/reject 自归档后 handoff scout 开新轮。第一发注入由 supervisor 走 admin 面以 --from critic 署名，你收到的是 queued 收件行，无需处理。"""
admin = false
max_sessions = 1
reuse = true
allowed_senders = ["writer"]
allowed_targets = ["writer", "model", "scout"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]
[client.timeout]
ready_ms = 30000
running_ms = 120000
idle_ms = 60000
[client.intent]
attempts = 100000
backoff_ms = [1000, 2000, 4000, 10000, 30000, 60000]

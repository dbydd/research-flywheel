# Onlyne v1（工具链追 latest，版本闸只设 protocol=1 下限）alexandria spec —— 拓扑唯一真相
#
# 解析即启动校验：出现未知键或类型错误时直接拒绝，报错形如 `spec.toml:<行号>: <消息>`。
# 改完用 `onlyne reload --server-root .`；预览差异跑只读动词 `onlyne spec_diff --server-root .`（reload 无 --dry-run）。
# 本仓流程固定，装配层已撤：没有 stage 文件，没有 promote 脚本。改拓扑就改本文件与 templates/，再 reload。
# 定稿顺序（非法 key 会让全量 parse 连 client init 都跑不动，占位 key 必须合法长度）：
#   1) 空根 `onlyne-server init --root . --listen 127.0.0.1:7812`（产 .onlyne/keys/server.key 与 cert_pin，cert_pin 打到 stdout；spec.toml 已就位则 init 拒绝覆盖，先挪开再放回）
#   2) 回填 [server].cert_pin
#   3) 各 role key 先播合法 32 字节占位 base64（AQEBAQ...AQE= 形）
#   4) 逐 role 渲染并铸 key：`onlyne-server generate --root . --role <r>`（ClientEntry 无 template 字段，只认 template_root/<role> 平铺；bare generate 会为无模板的 _supervisor 报错，故按 6 个 agent 各跑一次，_supervisor 不渲 ws）。每次 stdout 打 [[client]] 行，key 粘回本文件对应 [[client]]
#   5) `onlyne server start --root .`（run 不写 pid；判活用 `onlyne status --server-root .` 的 socket_present，status 不认 --root；深路径看 .onlyne/run/socket）→ 改拓扑后 `onlyne reload`
# 运行期没有任何配置 API：这份文件就是全部。

[server]
name = "alexandria"                              # 集群名；{{cluster}}/{{server_name}} 占位符的源头
listen = "127.0.0.1:7812"
cert_pin = "sha256/+dovmaOR3HAPhzSLGC0im3CsjnT7JdOqCZTtbVeTUOU="
note_queue = false                               # note 不排队：目标离线即 recipient_offline
fault_history_days = 14
resync_lag = 256
heartbeat_timeout_ms = 30000
# pi 插件走 npm。每个 role 模板 `.pi/settings.json` 的 packages 写 `npm:pi-onlyne`。
# 本字段保持空串：generate 原样保留 npm 路径，产物零绝对路径。
# 首次由人跑一次 `pi install npm:pi-onlyne`，装渠道 latest。
# 源码跟未发布 fix 时，把本字段填成 onlyne checkout 里 `plugins/onlyne-agent-pi` 的绝对路径；generate 会 vendor 进每个 ws 的 `.onlyne/agent/<basename>/`，并把 settings 里与本字段字面值相同的条目改写成 `../.onlyne/agent/<basename>`。
agent_package = ""
# 1.1.x 可选闸（省略即默认）：stale_watch_secs=60、heartbeat_grace_secs=90、requeue_max_attempts=0（无限）、requeue_ttl_secs=0（关）。
template_root = ".onlyne/templates"

# ---- supervisor：管理者节点就是仓根本身，不起 client 进程；签发名 _supervisor。----
# 它的 send 走瘦入口 `onlyne --server-root . send --from _supervisor --to <role> --text "<四段>"`（落账 admin=true）。
# 角色的 completion 回执自动回流 origin（origin==收件方时免 ACL）。角色侧零指向 _supervisor 的上行边，环就不进 supervisor。
# key 是合法长度占位（base64 32 字节），不起 client 即不验真身。
[[client]]
role = "_supervisor"
key = "ed25519/AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="  # 合法长度占位（base64 32×0x01）；不起 client 即不验真身
prose = """我是 alexandria 的 supervisor，也就是管理者节点本身，同时是人机界面：用户只和我直接对话。我的活四样：答问、派工、值班、记账。我不进工作流：第一发投给 scriber，之后接力在 role 之间自转。岗位说明在 `.supervisor/AGENTS.md`，运维口径在 `README.md`，角色行为约定在 `.onlyne/AGENTS.md`。现场观察与运维走 admin 面：status / roles / sessions / ledger / faults / watch / history / reload / spec_diff / repair* / control。spec.toml 是唯一配置真相；role 与模型的改动都落文件再 reload。"""
admin = true
max_sessions = 1
allowed_senders = []                               # 上行边永久关闭；回执走 origin 自动通道不经 ACL
allowed_targets = ["scriber"]                      # 第一发与人工唤醒；入口 role 见角色表 ★ 行
session_command = []

# ---- deep research 线性工作流：scriber → {librarian, astrologer} → master ⇄ socrates → scraper → 收敛。----
# master⇄socrates 的放行权在 socrates：报告收束由 socrates 判定并放行给 scraper，master 只回改。
# relay 一律 handoff（parent_task+hop 血缘）。残差流随 handoff 传递，口径见 .onlyne/AGENTS.md。
# 共用条款在仓根 AGENTS.md（omp/pi 沿父目录链进每个 role 会话），prose 只放身份与上报纪律。
# 单例（scriber/master 每任务族一个）是软约束，靠任务书维持；spec 不设并发闸。

[[client]]
role = "scriber"                                   # ★ entry role（第一发投递对象）
key = "ed25519/OHrTekAOVptRdIjGHKp+Wy5XMUEK4Iyi1SPL1o+DzH4="
prose = """我是 scriber，deep research 工作流的入口。任务书到我手上：一个链接、一份 PDF 的 URL，或用户已经放在某处的材料。我把原文整理进 `raw/`（论文 `<年月>/<学科>/<刊名>/<论文名>/`，博客与其他在线文章 `<年月>/<领域>/<站点>/<slug>/`，一目录一资源），抽取出文本，并把图抽进同目录 `assets/`（`pdfimages` 或 pymupdf，命名按 wiki-format 的 `<slug>-fig<N>`），写摘要页：论文落 `papers/abstracts/<paper>-abstract.md`，博客与其他在线文章落 `blogs/abstracts/<slug>-abstract.md`，两树同构，放哪棵由任务书点名的资源定；再按 paper-sources 大批量快扫相关文献补这份资源的前提背景（它立在什么问题上、依赖哪些先前工作、作者与组的来路），覆盖大部分前提信息靠的是广度与速度，落 `papers/context/`（博客 `blogs/context/`）或摘要页补充段。然后 handoff 给 librarian；任务书点名要人物画像时另发一路给 astrologer。交接时构造残差流：把本任务族到目前的产物列成索引交给下一跳。主线之外我是自由的，看见该做的顺手做，handoff 与 complete 照做。任务书四段是唯一交接面，结果一行进 onlyne_complete 的 text。我写文件与账；.onlyne/ 与 spec 面只读。"""
admin = false
max_sessions = 4
allowed_senders = ["_supervisor"]
allowed_targets = ["librarian", "astrologer"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]

[[client]]
role = "librarian"
key = "ed25519/TQ9X27K3xg2YXvGaqOhQf8XE/EdEIhUa3yR+nEepOrw="
prose = """我是 librarian，工作流的资料搜集位。收到资源对象后（论文或博客文章，两树同构），我从网上、wiki 与本地其余文献里理出这份资源的脉络，产出增强信息页：论文落 `papers/context/<paper>-context.md`，博客落 `blogs/context/<slug>-context.md`；页面回答五个问题：这份资源做了什么、可能是在什么基础上做的、相关引用文献引用在哪里、哪个组或谁做的、这个组或作者有什么特点。多渠道口径见 `.agents/skills/paper-sources/SKILL.md`，先读它再动手。一条线一个任务，可多播并行；每条线只答自己那一段，结论带来源。做完 handoff master，残差流原样带上并追加自己的产物。我写文件与账；.onlyne/ 与 spec 面只读。"""
admin = false
max_sessions = 4
allowed_senders = ["scriber"]
allowed_targets = ["master"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]

[[client]]
role = "astrologer"
key = "ed25519/VzoQ0o6uap03L8C8wCAuPT9pbq9qfDgZepSqavNJfcc="
prose = """我是 astrologer，工作流里的人物画像位，可选路径。任务书点名要我时，我从论文作者出发采集合作关系与履历，按 `scientist-profiles` 的页面契约落 `people/<slug>.md`，并给出覆盖度读数。采集超参按任务书给的来，任务书没给用该 skill 的默认值。做完 handoff master，残差流原样带上并追加自己的产物。我写文件与账；.onlyne/ 与 spec 面只读。"""
admin = false
max_sessions = 4
allowed_senders = ["scriber"]
allowed_targets = ["master"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]

[[client]]
role = "master"
key = "ed25519/zN+PyPchV85hMjOwXtM883saT/WHnjy+J8BQv0u9UQM="
prose = """我是 master，工作流的汇总位。我先读残差流列出的每一份产物，再汇总成精读报告：论文落 `papers/readings/<YYYY-MM>/<学科>/<刊名>/<paper>-reading.md`，博客落 `blogs/readings/<YYYY-MM>/<领域>/<站点>/<slug>-reading.md`，路径与该资源在 raw 下同构；任务书要求时做 ppt，演示产物落 `papers/decks/<slug>/`（博客 `blogs/decks/<slug>/`）。引用原文图用 `![[…assets/<slug>-fig<N>…]]` 嵌进页面；报告里值得自己画一张图（对数轴、对比图一类）时也可以画，脚本落 `tools/scripts/`，不强制。报告按 `wiki-format` 的精读页形状写，资源事实与「我的分析」分区。报告必须自足且连贯：概念首次出现就地解释，承重数字写进正文，需要原文为证的段落整段嵌入或归纳转述；外部指称记号要擦得掉且就地可兑现——外指冠名（「《论文名》§3.2.1」），内指对得上本页真标题，裸编号与抽取文本行号不落正文——读者从头到尾不必打开第二个文件。对质位只读报告本体，写「详见某链接」「见行 xxx」代替解释会被打回。写完 handoff socrates 对质；socrates 的意见到我这里时逐条修订，改完再交回去。收束的判定权在 socrates，我等它的放行，不自行 scraper。缺料自己补，不回环找 scriber。我写文件与账；.onlyne/ 与 spec 面只读。"""
admin = false
max_sessions = 4
allowed_senders = ["librarian", "astrologer", "socrates"]
allowed_targets = ["socrates"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]

[[client]]
role = "socrates"
key = "ed25519/UXdO4R6v0w/D+sWm4ENFmRTTnDFJN9JDL2v0xoBDtJg="
prose = """我是 socrates，工作流的对质位，也是 master⇄socrates 循环的放行者，身份是恶意审稿人：替真实读者收稿，先验假设是这份报告一定有问题，我的活是把问题挖出来，报告得自己证明清白。同时我以一无所知读者自居：只读精读报告本体，不读残差流，不带外部先验——没看过这份资源与任何相关文献。逐条追问主张的证据、口径、边界，核心是验收自足性：概念是否首次出现就解释，关键数字是否写在正文，外部链接是否只做溯源而把理解外包给了链接，正文里的外部记号是否兑现得了（光秃的 §坐标、点不开的链接、对不上本页真标题的自指编号都算读不懂）。读者读不懂的地方写成对质清单交回 master。报告引用了 `assets/` 里的图，可以点开图核一眼锚点对不对，不强制。我不查外部文献：缺口只点名，补料是 master 的事。对质清单是判决书：逐条给位置、现场、判据、改法；站得住的明写「过」。放行判据：摘掉全部外部链接，报告仍是一篇连贯、自足、一无所知的读者能看懂个七七八八、经得起「默认有问题」拷问的文章——达到这条才 handoff scraper 拆知识点。没达到就把缺口写清交给 master 回改。我写文件与账；.onlyne/ 与 spec 面只读。"""
admin = false
max_sessions = 4
allowed_senders = ["master"]
allowed_targets = ["master", "scraper"]
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]

[[client]]
role = "scraper"
key = "ed25519/qftTSe7MCj0sa77qqj3oqim5b8/fMd1BnVP8eQgxRNw="
prose = """我是 scraper，工作流的收敛点。定稿的精读报告到我手上：我按拆碎规则把里面的知识点拆成 `wiki/` 页面（concept、entity、comparison、idea 各就各位），同一知识点合并进单个文件，目录层级随知识点归类调整，链接只写真实关系。拆完做收尾清理：把仓根 `AGENTS.md` 支线区里本任务族的 todo 条目逐条删掉——todo 无完成标记，办完即删，产物落点交索引表行承载。清完只 complete 不 handoff，工作流在这一跳收敛。我写文件与账；.onlyne/ 与 spec 面只读。"""
admin = false
max_sessions = 4
allowed_senders = ["socrates"]                   # 放行权在 socrates；master 不回 scraper
allowed_targets = []
session_command = ["pi", "--session-id", "{session}", "--session-dir", ".pi/sessions"]

# 超时与重试都有默认值，可以省：[client.timeout] ready_ms=30000 idle_ms=60000
# [client.intent] attempts=3 backoff_ms=[1000,2000,4000]。
